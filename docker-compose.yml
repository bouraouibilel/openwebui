services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: OpenwebUI

    ports:
      - "3000:8080"

    environment:
      # Connexion à Ollama installé sur Windows
      OLLAMA_BASE_URL: "http://host.docker.internal:1234"

      # Création automatique du premier utilisateur admin
      WEBUI_ADMIN_NAME: "Admin"
      WEBUI_ADMIN_EMAIL: "bouraouibilel@gmail.com"
      WEBUI_ADMIN_PASSWORD: "${OPENWEBUI_PASSWORD}"

      # Authentification activée
      WEBUI_AUTH: "true"


      AIOHTTP_CLIENT_TIMEOUT: 1800

    volumes:
      - open-webui-data:/app/backend/data

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

volumes:
  open-webui-data: